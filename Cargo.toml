[workspace]
members = ["crates/bb-api", "crates/bb-cli"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99.0"
repository = "https://github.com/ledubenjamin/bb-cli"
license = "MIT"
description = "Bitbucket Cloud for developers and coding agents"
readme = "README.md"
keywords = ["bitbucket", "cli", "git", "automation"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
bb-api = { path = "crates/bb-api", version = "0.1.2" }
anyhow = "1"
bytes = "1.12.1"
clap = "4.6.7"
clap_complete = "4.6.11"
crossterm = { version = "0.29", default-features = false }
directories = "6"
futures-util = "0.3"
httpdate = "1"
jaq-core = "3.1"
jaq-json = "2"
jaq-std = "3"
keyring-core = "1.0.0"
dbus-secret-service-keyring-store = { version = "1.0.1", default-features = false }
apple-native-keyring-store = { version = "1.0.2", default-features = false }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
mimalloc = "0.1"
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
rusqlite = "0.41.0"
sha2 = "0.11.0"
schemars = "1"
secrecy = "0.10"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.3", default-features = false }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = "1.28.0"
webbrowser = "1"
wiremock = "0.6"
jsonschema = { version = "0.59.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
# Structured tracing templates contain named properties rather than format arguments.
literal_string_with_formatting_args = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
