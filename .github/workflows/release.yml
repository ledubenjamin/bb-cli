name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.3)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Match the tag to Cargo versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          version = manifest['workspace']['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit('Release tag must match the Cargo workspace version')
          if manifest['workspace']['dependencies']['bb-api']['version'] != version:
              raise SystemExit('The bb-api dependency must match the workspace version')
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          for name in ('bb-api', 'bb-cli'):
              package = next(item for item in lock['package'] if item['name'] == name)
              if package['version'] != version:
                  raise SystemExit(f'{name} lockfile version does not match the tag')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nsha={sha}\n')
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/bb
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/release/bb
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/release/bb.exe
    defaults:
      run:
        shell: bash
    env:
      RELEASE_REF: refs/tags/${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Compile optimized tests
        run: cargo test --release --workspace --locked --no-run
      - name: Run optimized tests
        timeout-minutes: 5
        run: cargo test --release --workspace --locked
      - name: Test Windows Credential Manager
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: cargo test --release -p bb-cli --locked native_windows_keyring_round_trip -- --ignored
      - name: Build release binary
        run: cargo build --release -p bb-cli --locked
      - name: Package and test the release installer
        run: |
          python scripts/test_package.py
          python scripts/package.py --target '${{ matrix.target }}' --binary '${{ matrix.binary }}' --output dist
          python scripts/test_install.py --target '${{ matrix.target }}' --dist dist
      - name: Test PowerShell 7 installer
        if: runner.os == 'Windows'
        run: python scripts/test_install.py --target '${{ matrix.target }}' --dist dist --powershell pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  linux-compatibility:
    name: Install on ${{ matrix.os }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Install runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: Test the unchanged release archive
        run: python3 scripts/test_install.py --target '${{ matrix.target }}' --dist dist

  publish:
    name: Publish complete release
    needs: [version, build, linux-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-publication
      queue: max
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify all three platform archives are present
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_TAG'][1:]
          expected = set()
          for target, extension in (
              ('x86_64-unknown-linux-gnu', '.tar.gz'),
              ('aarch64-unknown-linux-gnu', '.tar.gz'),
              ('x86_64-pc-windows-msvc', '.zip'),
          ):
              archive = f'bb-{version}-{target}{extension}'
              expected.update((archive, archive + '.sha256'))
          actual = {path.name for path in Path('dist').iterdir()}
          if actual != expected:
              raise SystemExit(f'Unexpected release files: missing={expected - actual}, extra={actual - expected}')
          PY
      - name: Verify the tag still identifies the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
      - name: Publish archives and changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
